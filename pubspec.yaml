name: namma_bingo
description: "Networking bingo for events — built with Flutter + Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

  # QR — scan + generate. Dropped qr_code_scanner_plus (deprecated) and
  # pretty_qr_code (duplicate of qr_flutter).
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Networking
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2

  # Platform integrations
  url_launcher: ^6.2.2
  share_plus: ^10.1.2

  # Config
  flutter_dotenv: ^5.1.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Logging
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Codegen — run `dart run build_runner build --delete-conflicting-outputs`
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Splash setup helper. Run `dart run flutter_native_splash:create` when assets change.
  flutter_native_splash: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/bingo.png

flutter_native_splash:
  color: "#0D1F1C"
  image: assets/bingo.png
  android_12:
    image: assets/bingo.png
    color: "#0D1F1C"
